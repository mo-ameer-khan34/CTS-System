<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter OTP — TRACE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-badge"><svg viewBox="0 0 60 60" width="48" height="48" fill="none"><polygon points="30,3 57,18 57,42 30,57 3,42 3,18" fill="#001A57" stroke="#F0B429" stroke-width="2"/><text x="30" y="35" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="Arial">TRACE</text></svg></div>
      <h1>OTP Verification</h1>
      <p>Your request has been submitted to the Administrator</p>
    </div>

    <div id="waitingState" class="otp-waiting">
      <div class="spinner"></div>
      <p>Waiting for Administrator to generate and send your OTP...</p>
      <p class="text-muted">This may take a few minutes. The page will update automatically.</p>
      <button onclick="checkOTPReady()" class="btn btn-outline" id="checkBtn">Check Status</button>
    </div>

    <div id="otpForm" class="auth-form" style="display:none;">
      <div class="alert alert-success">OTP has been sent to your registered email address.</div>
      <div class="form-group">
        <label>Enter OTP sent to your email address <span class="required">*</span></label>
        <input type="text" id="otpInput" maxlength="10" placeholder="Enter OTP code">
      </div>
      <button onclick="verifyOTP()" class="btn btn-primary btn-full">Verify OTP</button>
      <div id="otpError" class="alert alert-error" style="display:none;margin-top:1rem;"></div>
    </div>
  </div>
</div>

<script>
const officerId = {{ officer_id }};
let checkInterval = null;

function checkOTPReady() {
  const fd = new FormData();
  fd.append('officer_id', officerId);
  fetch('{{ url_for("auth.check_otp_status") }}', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(data => {
      if (data.ready) {
        clearInterval(checkInterval);
        document.getElementById('waitingState').style.display = 'none';
        document.getElementById('otpForm').style.display = 'block';
      }
    });
}

checkInterval = setInterval(checkOTPReady, 15000);

function verifyOTP() {
  const otp = document.getElementById('otpInput').value.trim();
  const fd = new FormData();
  fd.append('officer_id', officerId);
  fd.append('otp', otp);
  fetch('{{ url_for("auth.verify_otp") }}', { method: 'POST', body: fd })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        window.location.href = '{{ url_for("auth.reset_password") }}';
      } else {
        const err = document.getElementById('otpError');
        err.textContent = data.message;
        err.style.display = 'block';
      }
    });
}
</script>
</body>
</html>
