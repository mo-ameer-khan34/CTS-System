<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Captain Login — TRACE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-badge">
        <svg viewBox="0 0 60 60" width="48" height="48" fill="none"><polygon points="30,3 57,18 57,42 30,57 3,42 3,18" fill="#001A57" stroke="#F0B429" stroke-width="2"/><text x="30" y="35" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="Arial">TRACE</text></svg>
      </div>
      <h1>Captain Login</h1>
      <p>Authorised personnel only</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}{% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('auth.captain_login') }}" class="auth-form">
      <div class="form-group">
        <label>Full Name <span class="required">*</span></label>
        <input type="text" name="full_name" required placeholder="Your registered full name">
      </div>
      <div class="form-group">
        <label>Officer ID <span class="required">*</span></label>
        <input type="text" name="officer_id" required placeholder="Your Officer ID">
      </div>
      <div class="form-group">
        <label>Password <span class="required">*</span></label>
        <div class="password-field">
          <input type="password" name="password" id="loginPw" required>
          <button type="button" class="pw-toggle" onclick="togglePw('loginPw', this)">Show</button>
        </div>
      </div>
      <div class="form-extra">
        <a href="{{ url_for('auth.forgot_password') }}?role=captain" class="link-subtle">Forgot Password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Login as Captain</button>
    </form>
    <div class="auth-footer">
      <p>Not yet registered? <a href="{{ url_for('auth.captain_signup') }}">Sign Up</a></p>
      <p><a href="{{ url_for('auth.index') }}">← Back to Home</a></p>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
