<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — TRACE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-badge"><svg viewBox="0 0 60 60" width="48" height="48" fill="none"><polygon points="30,3 57,18 57,42 30,57 3,42 3,18" fill="#001A57" stroke="#F0B429" stroke-width="2"/><text x="30" y="35" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="Arial">TRACE</text></svg></div>
      <h1>Set New Password</h1>
      <p>OTP verified. Please set your new password.</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}{% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endif %}
    {% endwith %}
    <form method="POST" action="{{ url_for('auth.reset_password') }}" class="auth-form">
      <div class="form-group">
        <label>New Password <span class="required">*</span></label>
        <input type="password" name="new_password" required minlength="8" placeholder="Minimum 8 characters">
      </div>
      <div class="form-group">
        <label>Confirm New Password <span class="required">*</span></label>
        <input type="password" name="confirm_password" required placeholder="Re-enter new password">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Update Password</button>
    </form>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
